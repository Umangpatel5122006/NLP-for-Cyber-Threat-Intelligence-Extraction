# Existing entity settings; ACTION profile selected by train-only grouped CV.
train_relevant_only: true
layers:
  entities:
    model: crf_tagger
    parameters:
      algorithm: lbfgs
      c1: 1.8427
      c2: 0.137
      min_freq: 3
      max_iterations: 100
      all_possible_transitions: true
  action:
    model: crf_tagger
    parameters:
      algorithm: lbfgs
      c1: 1.0
      c2: 1.0
      min_freq: 0
      max_iterations: 200
      all_possible_transitions: true
      feature_config:
        use_action_morphology: true
        use_action_lexicon: true
