name: Classical NLP tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      CTI_ALLOW_TEST: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned core environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-lock.txt
          .venv/bin/python -m pip install --no-build-isolation -e .
          .venv/bin/python -m pip check
      - name: Verify scope and tokenizer initialization
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import spacy
          from cti.core.model_policy import CLASSICAL_NER_MODULES
          assert set(CLASSICAL_NER_MODULES) == {"crf_tagger", "memm_tagger", "token_logreg"}
          assert spacy.blank("en").pipe_names == []
          for name in ("torch", "transformers", "torchcrf", "accelerate"):
              assert importlib.util.find_spec(name) is None, name
          PY
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Check frontend JavaScript syntax
        run: |
          node --check src/cti/web/static/app.js
          node --check scripts/check_web_ui.mjs
      - name: Run the complete classical suite
        run: |
          .venv/bin/python -VV > results/ci-environment.txt
          .venv/bin/python -m pip freeze --all >> results/ci-environment.txt
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee results/ci-unittest.txt
      - name: Exercise train/dev relevance persistence
        run: |
          .venv/bin/python -m cti.train_relevance \
            --output models/ci-relevance.joblib \
            --report results/ci-relevance-dev.json
      - name: Train and reload classical entity/action taggers
        run: |
          .venv/bin/python -m cti.train_ner --results-dir results/ci-ner
      - name: Check saved NER document inference
        run: |
          .venv/bin/python -m cti.analyze \
            --text "APT29 used Mimikatz and contacted 10.1.2[.]3." \
            --output results/ci-ner/demo.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/ci-ner/demo.json").read_text(encoding="utf-8"))
          assert set(result["metadata"]["ner"]) == {"entities", "action"}
          assert all(item["status"] == "ok" for item in result["metadata"]["ner"].values())
          assert all(result["text"][e["start"]:e["end"]] == e["text"] for e in result["entities"])
          evidence = result["entities"] + result["metadata"]["sentences"]
          assert all(result["original_text"][e["original_start"]:e["original_end"]] == e["original_text"] for e in evidence)
          assert result["metadata"]["offsets"]["unit"] == "unicode_code_points"
          assert any("[.]" in e["original_text"] for e in result["entities"])
          assert result["metadata"]["merge"]["policy"] == "conservative_occurrence_v1"
          identifiers = {f["id"] for f in result["findings"]}
          assert identifiers
          for finding in result["findings"]:
              assert finding["evidence"]
              assert set(finding["parent_ids"] + finding["component_ids"]) <= identifiers
              assert result["original_text"][finding["original_start"]:finding["original_end"]] == finding["original_text"]
          keys = lambda rows: {(e["start"], e["end"], e["label"], e["source"], e["confidence"]) for e in rows}
          assert keys(result["entities"]) == keys([e for f in result["findings"] for e in f["evidence"]])
          assert all({edge["left_id"], edge["right_id"]} <= identifiers for edge in result["overlaps"])
          PY
      - name: Check the review API with real saved models
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from cti.web.server import ReviewEngine
          engine = ReviewEngine()
          assert all(mode["ready"] for mode in engine.status()["modes"])
          for mode in ("ner", "ioc"):
              result = engine.analyze({"mode": mode, "text": "APT29 contacted 10.1.2[.]3."})
              assert result["analysis"]["mode"] == mode
              assert result["document"]["findings"]
              assert result["document"]["original_text"] == "APT29 contacted 10.1.2[.]3."
              Path(f"results/ci-ner/web-{mode}.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classical-nlp-validation
          if-no-files-found: ignore
          path: |
            results/ci-environment.txt
            results/ci-unittest.txt
            results/ci-relevance-dev.json
            results/ci-relevance-dev.predictions.csv
            results/ci-ner/
